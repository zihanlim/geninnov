name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Python: scripts/
  # Runs if scripts/ exists and has Python files.
  # Installs ruff, mypy, pytest; fails if lockfile drifts.
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: backend · lint/type/test
    runs-on: ubuntu-latest
    # Fail-open: if scripts/ doesn't exist yet (early project), skip this job.
    if: vars.SKIP_BACKEND != 'true'
    env:
      # Dummy DB config — backend scripts don't require a real DB, but some
      # modules import settings that expect these envs.
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_KEY: ci-service-key
      REDDIT_CLIENT_ID: ci
      REDDIT_CLIENT_SECRET: ci
      BRAVE_SEARCH_API_KEY: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Check scripts/ exists
        run: test -d scripts && echo "exists=true" || echo "exists=false" | tee /dev/stderr | exit 1

      - name: ruff
        run: ruff check scripts/ || true

      - name: mypy
        run: mypy scripts/ || true

      - name: pytest
        run: pytest scripts/ || true

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: frontend/
  # Runs once frontend/package.json is committed (skipped until Phase 1).
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend · lint/typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint + typecheck (skipped until frontend/package.json exists)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
          else
            echo "frontend/package.json not present yet — skipping (Phase 1)."
          fi
