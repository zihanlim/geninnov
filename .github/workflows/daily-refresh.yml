name: Daily Refresh

# Runs the L0–L5 scoring pipeline (scripts/daily_refresh.py) on a schedule so the
# book/scores refresh without anyone running it locally. Secrets live in GitHub
# (Settings → Secrets and variables → Actions), never in the repo — same
# principle as Vercel's env vars.

on:
  schedule:
    # 21:30 UTC on weekdays ≈ 4:30pm EST / 5:30pm EDT — after the US close.
    # GitHub cron is UTC and does NOT adjust for DST; runs can be delayed under load.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

concurrency:
  group: daily-refresh
  cancel-in-progress: false   # let an in-flight refresh finish; queue the next

permissions:
  contents: read

jobs:
  refresh:
    name: L0–L5 daily pipeline
    runs-on: ubuntu-latest
    # L5 alone can legitimately run long: reason_picks waits up to
    # LLM_TIMEOUT_SECONDS (900s) per attempt and may use both its retries, and
    # L0-L4 (news, prices, factors) runs before it. The old 30-minute ceiling would
    # kill the job mid-book and leave the day with no thesis — the exact failure the
    # timeout raise was fixing. A run that actually hits 60 minutes has a real
    # problem and should fail rather than hang.
    timeout-minutes: 60
    env:
      # ── Secrets (add these in repo Settings → Secrets → Actions) ──
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional L5 fallback
      # ── Non-secret config (safe to hardcode) ──
      LLM_PROVIDER: minimax
      ANDROMEDA_ALLOW_MOCK: "0"   # real-or-empty, never fabricated (RESIDUAL R0b)
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node (for the Brave news helper)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          # daily_refresh's runtime deps. The theme-discovery ML block in
          # backend/requirements.txt (torch/hdbscan/gensim/umap) is NOT imported
          # by the daily pipeline, so it's skipped to keep runs fast.
          # cvxpy is on the critical path: backend/services/optimizer.py sizes the
          # book with it. Without it the run still publishes — size_positions falls
          # back to conviction weighting and says so — but it silently stops using
          # the optimizer, which is the kind of degradation nobody notices.
          pip install "pandas>=2.2.0" "numpy>=1.26.0" scipy requests \
                      "cvxpy>=1.9.1" \
                      "yfinance>=0.2.0" "praw>=7.7.0" "httpx>=0.27.0" \
                      "nltk>=3.8.0" "vaderSentiment>=3.3.0" "supabase>=2.0.0" \
                      python-dotenv
          python -m nltk.downloader -q vader_lexicon

      - name: Guard — required secrets present
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo "::error::SUPABASE_SERVICE_KEY secret missing"; exit 1; }
          test -n "$FRED_API_KEY" || echo "::warning::FRED_API_KEY missing — macro series will be skipped"
          test -n "$BRAVE_SEARCH_API_KEY" || echo "::warning::BRAVE_SEARCH_API_KEY missing — news will be empty"
          test -n "$MINIMAX_API_KEY" || echo "::warning::MINIMAX_API_KEY missing — L5 book falls back to the deterministic template"

      - name: Run daily refresh (L0–L5)
        run: python scripts/daily_refresh.py

      # Re-measure HypeScore's information coefficient against the history this run
      # just extended, and persist it to backtest_results — the /method "Does
      # HypeScore actually predict returns?" panel reads that table, so the
      # validation status keeps itself current and fills in the moment there are
      # enough run-dates with a forward price window. Non-fatal: a validation
      # hiccup must never fail the refresh that already persisted the book.
      - name: Refresh HypeScore IC validation
        if: success()
        run: |
          python scripts/backtest_hype.py --horizons 1 5 20 --persist \
            || echo "::warning::HypeScore IC backtest did not complete"

      # Records a `pending` row for every pick in the book just published, and resolves
      # any whose 21-trading-day horizon has matured (ADR-0090). Runs AFTER the refresh
      # so today's book is included the day it is published — the commitment is logged
      # before the outcome is knowable, which is the whole point of the table.
      #
      # Non-fatal, like the IC step above: this reports on the book, it does not produce
      # it, and a yfinance hiccup must never fail a refresh that already persisted a book.
      # Idempotent, so the next run picks up whatever this one missed.
      #
      # `always()`, NOT `success()`, and the difference is the whole point of the step.
      # `|| echo` is what makes it non-fatal; `success()` made it SKIPPED whenever an
      # earlier step failed — which inverted the guarantee, because the case where the
      # recorder is most needed is exactly the case where the refresh partly failed. The
      # book is published in phase 5; L5b runs LAST. So "book published, then a late
      # phase died" leaves claims unrecorded and, under `success()`, silently skips the
      # only thing that would have recorded them. That is ADR-0117's defect — 9 of 32
      # published claims had no row on 2026-07-27 — reinstated by a workflow condition.
      #
      # Safe to run unconditionally: pass 1 is insert-if-absent, so re-recording is a
      # no-op (verified live — a second run wrote 0 rows), and if the refresh failed
      # before publishing anything it simply finds the previous book already recorded.
      # The integrity guard below already uses `always()` for the same reason.
      - name: Resolve published-pick outcomes (forward track record)
        if: always()
        run: |
          python -m scripts.resolve_outcomes \
            || echo "::warning::outcome resolution did not complete"

      - name: Data-integrity guard (fabricated-data fingerprint)
        if: always()
        run: python scripts/check_data_integrity.py || echo "::warning::integrity check flagged the output"
