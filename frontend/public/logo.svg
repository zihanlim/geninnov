<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Outer circle -->
  <circle cx="120" cy="120" r="100" />

  <!-- Infinity ribbon: two overlapping circles forming a horizontal figure-8 -->
  <circle cx="80" cy="120" r="42" />
  <circle cx="160" cy="120" r="42" />

  <!-- Left loop inner: five vertical stripes with dots at the bottom -->
  <line x1="62" y1="106" x2="60" y2="158" />
  <line x1="72" y1="100" x2="71" y2="163" />
  <line x1="82" y1="100" x2="82" y2="163" />
  <line x1="92" y1="100" x2="93" y2="163" />
  <line x1="102" y1="106" x2="104" y2="158" />

  <circle cx="60" cy="160" r="3.2" fill="white" stroke="none" />
  <circle cx="71" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="82" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="93" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="104" cy="160" r="3.2" fill="white" stroke="none" />

  <!-- Right loop inner: mirror of left -->
  <line x1="138" y1="106" x2="136" y2="158" />
  <line x1="148" y1="100" x2="147" y2="163" />
  <line x1="158" y1="100" x2="158" y2="163" />
  <line x1="168" y1="100" x2="169" y2="163" />
  <line x1="178" y1="106" x2="180" y2="158" />

  <circle cx="136" cy="160" r="3.2" fill="white" stroke="none" />
  <circle cx="147" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="158" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="169" cy="165" r="3.2" fill="white" stroke="none" />
  <circle cx="180" cy="160" r="3.2" fill="white" stroke="none" />
</svg>
